[project]
name = "pyinject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavel Novoidarskii", email = "sorvihead1@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi==0.162.5",
    "mypy==2.4.1",
    "pyright==1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
line-length = 120
src = ["src"]
# Infer the target Python version from project.requires-python.
force-exclude = true

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # Syntax and import errors; formatting belongs to ruff format.
    "F",              # Pyflakes.
    "I",              # Import sorting.
    "UP",             # Modern Python syntax.
    "B",              # Common bugs.
    "SIM",            # Simplifications.
    "C4",             # Comprehensions.
    "PIE",            # Redundant code.
    "ANN",            # Require function annotations.
    "PT",             # pytest conventions.
    "PGH",            # Specific suppression comments.
    "RUF",            # Ruff-specific checks.
]
# Dynamic providers and heterogeneous registries may legitimately need Any.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"test_*.py" = ["ANN"]

[tool.ruff.format]
# Preserve the upstream Linear specification verbatim.
exclude = ["docs/api/source-spec.md"]
docstring-code-format = true

[tool.ty.environment]
root = ["src", "."]
# Check a portable library without assuming the developer's operating system.
python-platform = "all"
# Infer the target Python version from project.requires-python.

[tool.ty.rules]
redundant-cast = "error"
unused-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.mypy]
python_version = "3.15"
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
include = ["src", "scripts", "tests", "examples"]

[tool.ty.src]
exclude = ["tests/typing/**/negative.py"]
