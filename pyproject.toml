[project]
name = "pyinject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavel Novoidarskii", email = "sorvihead1@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
line-length = 120
src = ["src"]
# Infer the target Python version from project.requires-python.
force-exclude = true

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # Syntax and import errors; formatting belongs to ruff format.
    "F",              # Pyflakes.
    "I",              # Import sorting.
    "UP",             # Modern Python syntax.
    "B",              # Common bugs.
    "SIM",            # Simplifications.
    "C4",             # Comprehensions.
    "PIE",            # Redundant code.
    "ANN",            # Require function annotations.
    "PT",             # pytest conventions.
    "PGH",            # Specific suppression comments.
    "RUF",            # Ruff-specific checks.
]
# Dynamic providers and heterogeneous registries may legitimately need Any.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"test_*.py" = ["ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
root = ["src"]
# Check a portable library without assuming the developer's operating system.
python-platform = "all"
# Infer the target Python version from project.requires-python.

[tool.ty.rules]
redundant-cast = "error"
unused-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true
